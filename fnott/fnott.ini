# Shared by Prometheus, Hephaestus, and Daedalus. Colors and border geometry
# match river/environment and fuzzel/common.ini; output is unset so River
# chooses the focused output.

# Fuzzel is the installed dmenu-compatible selector. The NUL-separated mode
# preserves action labels containing newlines.
selection-helper=fuzzel --dmenu0
selection-helper-uses-null-separator=yes

# Low and normal notifications use an application-requested timeout up to five
# seconds, or five seconds when the application does not request one.
default-timeout=5
max-timeout=5

dpi-aware=yes
title-font=IBM Plex Sans:size=9
summary-font=IBM Plex Sans:size=11
body-font=IBM Plex Sans:size=10
border-size=2
border-radius=6

[low]
background=002b36f2
border-color=586e75ff
title-color=586e75ff
summary-color=93a1a1ff
body-color=839496ff

[normal]
background=002b36f2
border-color=93a1a1ff
title-color=839496ff
summary-color=eee8d5ff
body-color=93a1a1ff
progress-color=93a1a1ff

# Critical notifications keep Fnott's built-in red palette (6c3333ff bg, white
# text) and remain until dismissed when the application does not request a
# timeout. Explicit application timeouts are still honored.
[critical]
default-timeout=0
max-timeout=0
