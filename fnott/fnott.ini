# Shared by Prometheus, Hephaestus, and Daedalus. Visual settings intentionally
# use Fnott's defaults; output is unset so River chooses the focused output.

# Fuzzel is the installed dmenu-compatible selector. The NUL-separated mode
# preserves action labels containing newlines.
selection-helper=fuzzel --dmenu0
selection-helper-uses-null-separator=yes

# Low and normal notifications use an application-requested timeout up to five
# seconds, or five seconds when the application does not request one.
default-timeout=5
max-timeout=5

dpi-aware=yes
title-font=IBM Plex Sans:size=9
summary-font=IBM Plex Sans:size=11
body-font=IBM Plex Sans:size=10

# Critical notifications remain until dismissed when the application does not
# request a timeout. Explicit application timeouts are still honored.
[critical]
default-timeout=0
max-timeout=0
