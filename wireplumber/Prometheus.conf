# Keep all playback priorities below microphone priorities (normally 1600+).
# USB-C headphones and DACs appear as USB ALSA outputs.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.usb-.*" } ]
    actions = { update-props = { priority.session = 1400 } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Headphones__sink" } ]
    actions = { update-props = { priority.session = 1400 } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" } ]
    actions = { update-props = { priority.session = 1000 } }
  }
  {
    matches = [ { node.name = "~alsa_output.*HiFi__HDMI[0-9]+__sink" } ]
    actions = { update-props = { priority.session = 500 } }
  }
]

monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" media.class = "Audio/Sink" } ]
    actions = { update-props = { priority.session = 1300 } }
  }
]

wireplumber.components = [
  {
    name = prometheus-output-profile.lua
    type = script/lua
    provides = hooks.device.prometheus-output-profile
  }
]
wireplumber.profiles = {
  main = { hooks.device.prometheus-output-profile = required }
}
