# Terminal capabilities, passthrough, clipboard, and focus.
# tmux 3.8 auto-detects foot locally; terminal-features acts as fallback over SSH
# or in kitty.
set -as terminal-features ",foot*:RGB,foot*:extkeys,foot*:usstyle,xterm-kitty:extkeys"
set -g mouse on
# Forward pane focus changes to terminal applications. In terminal Emacs this
# allows focus-in hooks such as auto-revert to run after an agent edits files.
set -s focus-events on
set -s set-clipboard on
# Allow Yazi Sixel previews, OSC 8 hyperlinks, and agent notifications in foot.
set -g allow-passthrough on
set -g update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK"

# Extended (CSI u) keys, so TUIs such as pi can tell modified Enter apart.
set -s extended-keys on
set -s extended-keys-format csi-u

# General QOL
set -g history-limit 50000
set -g detach-on-destroy off
set -g display-time 2000
set -g display-panes-time 2000
set -g set-titles on
set -g set-titles-string "#S: #W"

# Number windows and panes from 1, matching the M-<n> bindings below.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Prefix is Ctrl+Space instead of Ctrl+b.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config with confirmation.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Splits open in the current pane's directory (c stays vanilla: session root).
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Pane navigation stays behind the prefix: prefix-less C-h/j/k/l would take
# those keys away from Emacs. Non-repeatable so typing right after switching
# panes is never swallowed.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window and session navigation (a reclaims last-window shadowed by l;
# t reclaims choose-tree -Zs shadowed by s).
bind a last-window
bind t choose-tree -Zs
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vi copy mode
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Project, PDF, and forge shortcuts (run-shell -b avoids flashing a temp window;
# fzf --tmux in tmux-session and tmux-pdf opens a popup over the active pane).
bind f run-shell -b '~/.config/scripts/tmux-session'
bind B run-shell -b '~/.config/scripts/tmux-session ~/200_reading/'
bind W run-shell -b '~/.config/scripts/tmux-session ~/100_projects/'
bind S run-shell -b '~/.config/scripts/tmux-session ~/102_school_work/'
bind H run-shell -b '~/.config/scripts/tmux-session ~'
bind p run-shell -b -c "#{pane_current_path}" '~/.config/scripts/tmux-pdf'
bind o run-shell -b -E '~/.config/scripts/open-github "#{pane_current_path}"'

# Status bar: vanilla tmux 3.8 aesthetics (left-justified, theme-detected
# colors, #F window flags, single box-drawing pane borders). Position is set
# explicitly for easy adjustment; status-left is widened for project session
# names, and the redundant clock (already in creek) is removed.
set -g status-position bottom
set -g status-left-length 40
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[noreverse] ,}#{?pane_synchronized,#[reverse] SYNC #[noreverse] ,}"
