set -ga terminal-overrides ",:RGB"
set -as terminal-features ",xterm-kitty:extkeys"
set -g mouse on
# Forward pane focus changes to terminal applications. In terminal Emacs this
# allows focus-in hooks such as auto-revert to run after an agent edits files.
set -g focus-events on
set -g set-clipboard on
set -g update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK"

# pi_tui for enter key
set -g xterm-keys on
set -g extended-keys on
set -g extended-keys-format csi-u

# change master key to Ctrl + a instead of Ctrl + b
unbind C-b
unbind o
set -g prefix C-space
bind-key C-Space send-prefix

# Split windows (opens in same directory as current pane)
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf


set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind -n S-Left previous-window
bind -n S-Right next-window

# select between windows
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# vim style copy
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# tmux shortcuts and scripts
bind f run "tmux neww ~/.config/scripts/tmux-session"
bind B run "tmux neww ~/.config/scripts/tmux-session ~/200_reading/"
bind W run "tmux neww ~/.config/scripts/tmux-session ~/100_projects/"
bind S run "tmux neww ~/.config/scripts/tmux-session ~/102_school_work/"
bind H run "tmux neww ~/.config/scripts/tmux-session ~"
bind p new-window -c "#{pane_current_path}" ~/.config/scripts/tmux-pdf
# bind p run "tmux neww -c '#{pane_current_path}' ~/.config/scripts/open-pdf"
bind o run-shell '~/.config/scripts/open-github "#{pane_current_path}"'


# Status bar
set -g status on
set -g status-position top
set -g status-justify absolute-centre
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "bg=default"

# Windows
set -g window-status-separator ""
# set -g window-status-activity-style ...
# set -g window-status-style ...

# Statusline - current window (same info, no explicit colors)
set -g window-status-current-format " #I:#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) "
set -g window-status-current-style "fg=black bg=white"

# Statusline - other windows
set -g window-status-format " #I: #W "

# Statusline - right side (keep same segments/icons, no explicit colors)
set -g status-right "[] #W #{?client_prefix, , }[] #S "

# Statusline - left side (empty)
set -g status-left ""

set -g pane-border-lines simple

# Pane navigation is prefix + h/j/k/l, bound above.
#
# There used to be a vim-tmux-navigator block here binding C-h/j/k/l without
# a prefix, passing them through only to panes whose process matched
# vim|nvim|view|fzf. With Emacs in the pane that test never matched, so tmux
# swallowed C-h (the help prefix, including C-h B for embark-bindings), C-j
# (newline), C-k (kill-line) and C-l (recenter). Emacs gets those back.
